name: Actualizar perfil

on:
  schedule:
    - cron: "17 5 * * *"   # una vez al día
  workflow_dispatch:         # también manual: pestaña Actions > Actualizar perfil > Run workflow

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar panel y mapa de calor (datos reales de la API de GitHub)
        working-directory: scripts
        run: python generar_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/heatmap.svg
          git diff --cached --quiet || git commit -m "chore: actualizar panel de actividad y mapa de calor"
          git push

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Estudio Ingeniería de Sistemas e IA en la UPAO, en Trujillo. Defino el alcance, diseño la arquitectura y luego implemento. Trabajo con Scrum y XP en proyectos de frontend, backend, bases de datos e IA."><style>*{transform-box:fill-box}.l{animation:ap 1s ease-out both}@keyframes ap{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
<linearGradient id="gTxt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8FE3BC"/><stop offset="1" stop-color="#3DBE8B"/></linearGradient>
<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3DBE8B"/><stop offset="1" stop-color="#3DBE8B" stop-opacity="0"/></linearGradient>
</defs><rect x=".5" y=".5" width="999" height="349" rx="18" fill="#0E1814" stroke="#22362D"/><rect x="0" y="30" width="5" height="190" rx="2.5" fill="url(#gTxt)"/><text class="l" style="animation-delay:0.00s" x="44" y="66" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#EEF3EF">Estudio Ingeniería de Sistemas e IA en la UPAO, en Trujillo.</text><text class="l" style="animation-delay:0.25s" x="44" y="102" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#EEF3EF">Antes de escribir código intento entender el problema: defino el alcance</text><text class="l" style="animation-delay:0.50s" x="44" y="138" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#EEF3EF">en historias de usuario, diseño la arquitectura y recién después implemento.</text><text class="l" style="animation-delay:0.75s" x="44" y="174" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#EEF3EF">Trabajo con Scrum y XP en proyectos que combinan frontend, backend,</text><text class="l" style="animation-delay:1.00s" x="44" y="210" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#EEF3EF">bases de datos e IA.</text><text x="44" y="262" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9DB0A5">Sigo en formación: más abajo separo lo que ya usé en proyectos de lo que estoy aprendiendo.</text><rect x="44" y="286" width="290" height="44" rx="12" fill="#14231D" stroke="#3DBE8B" stroke-opacity=".55"/><circle cx="64" cy="308" r="4.5" fill="#3DBE8B"/><text x="80" y="313" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#9DB0A5" letter-spacing="1">ESTUDIO</text><text x="318" y="314" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#EEF3EF">UPAO · 6.º ciclo</text><rect x="348" y="286" width="290" height="44" rx="12" fill="#14231D" stroke="#8FE3BC" stroke-opacity=".55"/><circle cx="368" cy="308" r="4.5" fill="#8FE3BC"/><text x="384" y="313" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#9DB0A5" letter-spacing="1">LUGAR</text><text x="622" y="314" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#EEF3EF">Trujillo, Perú</text><rect x="652" y="286" width="290" height="44" rx="12" fill="#14231D" stroke="#D9B25F" stroke-opacity=".55"/><circle cx="672" cy="308" r="4.5" fill="#D9B25F"/><text x="688" y="313" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#9DB0A5" letter-spacing="1">MÉTODO</text><text x="926" y="314" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#EEF3EF">Scrum · XP</text></svg>
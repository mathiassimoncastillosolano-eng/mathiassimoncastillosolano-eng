<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Estudio Ingeniería de Sistemas e IA en la UPAO. Trabajo con Scrum y XP en proyectos de frontend, backend, bases de datos e IA"><defs>
<linearGradient id="gTxt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
<linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gScan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".55"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".08"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><rect x=".5" y=".5" width="999" height="249" rx="16" fill="#0D1421" stroke="#1E293B"/><rect x="0" y="24" width="4" height="120" rx="2" fill="url(#gTxt)"/><text x="40" y="58" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F8FAFC" fill-opacity="0">Estudio Ingeniería de Sistemas e IA en la UPAO. Antes de escribir código intento entender el problema:<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.05;0.20;1" dur="1.6s" fill="freeze"/></text><text x="40" y="90" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F8FAFC" fill-opacity="0">defino el alcance en historias de usuario, diseño la arquitectura y recién después implemento.<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.15;0.30;1" dur="1.6s" fill="freeze"/></text><text x="40" y="122" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F8FAFC" fill-opacity="0">Trabajo con Scrum y XP en proyectos que combinan frontend, backend, bases de datos e IA.<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.25;0.40;1" dur="1.6s" fill="freeze"/></text><text x="40" y="164" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#94A3B8">Estoy en etapa de formación: más abajo separo lo que ya usé en proyectos de lo que estoy aprendiendo.</text><rect x="40" y="188" width="290" height="38" rx="10" fill="#111C2B" stroke="#22D3EE" stroke-opacity=".5"/><circle cx="58" cy="207" r="4" fill="#22D3EE"/><text x="74" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#94A3B8" letter-spacing="2">FORMACIÓN</text><text x="182" y="212" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F8FAFC">UPAO · 6.º ciclo</text><rect x="350" y="188" width="290" height="38" rx="10" fill="#111C2B" stroke="#3B82F6" stroke-opacity=".5"/><circle cx="368" cy="207" r="4" fill="#3B82F6"/><text x="384" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#94A3B8" letter-spacing="2">UBICACIÓN</text><text x="492" y="212" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F8FAFC">Trujillo, Perú</text><rect x="660" y="188" width="290" height="38" rx="10" fill="#111C2B" stroke="#8B5CF6" stroke-opacity=".5"/><circle cx="678" cy="207" r="4" fill="#8B5CF6"/><text x="694" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#94A3B8" letter-spacing="2">METODOLOGÍA</text><text x="802" y="212" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F8FAFC">Scrum · XP</text></svg>